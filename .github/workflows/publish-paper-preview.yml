name: android-paper-preview-release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit on Nytshift/nytshift-android main
        required: true
        type: string
      source_run_id:
        description: Exact successful android-ci Actions run ID for that commit
        required: true
        type: string
      release_confirmation:
        description: Type PAPER xyz.nytshift.app.staging
        required: true
        type: string

permissions: {}

concurrency:
  group: android-paper-preview-release
  cancel-in-progress: false

jobs:
  preflight:
    name: read-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require public immutable repository settings
        shell: bash
        env:
          POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Nytshift/nytshift-android-releases"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test -n "$POLICY_READ_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['POLICY_READ_TOKEN']}",
              "User-Agent": "nytshift-android-paper-release-preflight",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          def get(path):
              request = urllib.request.Request(f"https://api.github.com{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"GitHub API preflight failed: {path} status={response.status}")
                  return json.load(response)
          repository = get("/repos/Nytshift/nytshift-android-releases")
          expected = {
              "full_name": "Nytshift/nytshift-android-releases",
              "private": False,
              "visibility": "public",
              "default_branch": "main",
              "archived": False,
          }
          if {key: repository.get(key) for key in expected} != expected:
              raise SystemExit("public release repository identity/settings differ")
          immutable = get("/repos/Nytshift/nytshift-android-releases/immutable-releases")
          if immutable.get("enabled") is not True:
              raise SystemExit("immutable releases are not enabled")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact dispatch and repository revision
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,17}$ ]]
          test "$RELEASE_CONFIRMATION" = "PAPER xyz.nytshift.app.staging"
          python3 tools/verify_repository.py
          python3 tools/secret_scan.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  sign:
    name: environment-approved-no-checkout-signing
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {}
    environment: android-paper-preview-signing
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Install independently pinned signing and manifest tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --location --silent --show-error \
            https://download.visualstudio.microsoft.com/download/pr/a9672056-0a4d-425d-8488-f481ee56319c/5897054114dd5c0acab8489cd815dad9/microsoft-jdk-17.0.20.1-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/microsoft-jdk-17.0.20.1-linux-x64.tar.gz"
          echo "d00e5b04e9726b63d915706c7049e5297c9f40239ce8a12fcc68b7267fa91ad2  $RUNNER_TEMP/microsoft-jdk-17.0.20.1-linux-x64.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/jdk"
          tar -xzf "$RUNNER_TEMP/microsoft-jdk-17.0.20.1-linux-x64.tar.gz" -C "$RUNNER_TEMP/jdk" --strip-components=1
          echo "e60625cbc7bebb2695d39f01b0dba0f9b534981386ab78bb73a327fd7cc3447f  $RUNNER_TEMP/jdk/bin/java" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/build-tools_r36_linux.zip \
            --output "$RUNNER_TEMP/build-tools_r36_linux.zip"
          echo "5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b  $RUNNER_TEMP/build-tools_r36_linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/build-tools_r36_linux.zip" -d "$RUNNER_TEMP/build-tools"
          echo "1a6a396b9cd071f7040071fdd108718cb98c3c9f4960044f373b288993d19eb7  $RUNNER_TEMP/build-tools/android-16/aapt2" | sha256sum --check
          echo "b47549e373b895ce6ca620d0c7887e674d9615ffa837a86ac601dcfd04adb0f0  $RUNNER_TEMP/build-tools/android-16/apksigner" | sha256sum --check
          echo "3716d9311e55d2b0918a2fd9d54ba9e406c5f6abeea700b287f11259bc163dec  $RUNNER_TEMP/build-tools/android-16/lib/apksigner.jar" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip" -d "$RUNNER_TEMP/cmdline-tools"
          echo "c3912376ada67603a09a45701397b8d1ccec2ea138122b8aaae9dc57b47064b0  $RUNNER_TEMP/cmdline-tools/cmdline-tools/bin/apkanalyzer" | sha256sum --check
          echo "a41766a6bf679feae9d8c65cfead8ba7573bd7762feedd808715a72a808328b2  $RUNNER_TEMP/cmdline-tools/cmdline-tools/lib/apkanalyzer-classpath.jar" | sha256sum --check
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jdk/bin/java" -version
      - name: Materialize the reviewed workflow-inline signing boundary
        shell: bash
        env:
          BOUNDARY_ZLIB_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          payload = zlib.decompress(base64.b64decode(os.environ["BOUNDARY_ZLIB_B64"], validate=True))
          expected = "ccaff059680da9a5d8011fd65bc019ac78f20f4966ee779e220366fb599c235e"
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit("workflow-inline signing boundary digest differs")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "signing_boundary.py"
          target.write_bytes(payload)
          target.chmod(0o500)
          PY
      - name: Acquire exact private evidence, validate, and sign
        shell: bash
        env:
          SOURCE_REPO_READ_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.ANDROID_PREVIEW_CERTIFICATE_SHA256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLIC_COMMIT: ${{ github.sha }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          BOUNDARY_ROOT: ${{ runner.temp }}/nytshift-signing-boundary
          HANDOFF_ROOT: ${{ runner.temp }}/nytshift-signing-handoff
          APKSIGNER: ${{ runner.temp }}/build-tools/android-16/apksigner
          APKANALYZER: ${{ runner.temp }}/cmdline-tools/cmdline-tools/bin/apkanalyzer
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_READ_TOKEN"
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          [[ "$EXPECTED_CERTIFICATE_SHA256" =~ ^[A-Fa-f0-9:]{64,95}$ ]]
          "$RUNNER_TEMP/jdk/bin/java" -version
          python3 "$RUNNER_TEMP/signing_boundary.py"
      - name: Remove source evidence and signing material before handoff upload
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/nytshift-signing-boundary"
          rm -f -- "$RUNNER_TEMP/signing_boundary.py"
          test ! -e "$RUNNER_TEMP/nytshift-signing-boundary"
          test ! -e "$RUNNER_TEMP/signing_boundary.py"
      - name: Upload the bounded non-secret signing handoff
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nytshift-paper-signing-handoff-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/nytshift-signing-handoff
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  verify-and-stage:
    name: fresh-secret-free-verification-and-staging
    needs:
      - preflight
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      download_url: ${{ steps.stage.outputs.download_url }}
      release_tag: ${{ steps.stage.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nytshift-paper-signing-handoff-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/nytshift-signing-handoff
      - name: Install independently pinned verification tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://download.visualstudio.microsoft.com/download/pr/a9672056-0a4d-425d-8488-f481ee56319c/5897054114dd5c0acab8489cd815dad9/microsoft-jdk-17.0.20.1-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/microsoft-jdk-17.0.20.1-linux-x64.tar.gz"
          echo "d00e5b04e9726b63d915706c7049e5297c9f40239ce8a12fcc68b7267fa91ad2  $RUNNER_TEMP/microsoft-jdk-17.0.20.1-linux-x64.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/jdk"
          tar -xzf "$RUNNER_TEMP/microsoft-jdk-17.0.20.1-linux-x64.tar.gz" -C "$RUNNER_TEMP/jdk" --strip-components=1
          echo "e60625cbc7bebb2695d39f01b0dba0f9b534981386ab78bb73a327fd7cc3447f  $RUNNER_TEMP/jdk/bin/java" | sha256sum --check
          curl --fail --location --silent --show-error https://dl.google.com/android/repository/build-tools_r36_linux.zip --output "$RUNNER_TEMP/build-tools_r36_linux.zip"
          echo "5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b  $RUNNER_TEMP/build-tools_r36_linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/build-tools_r36_linux.zip" -d "$RUNNER_TEMP/build-tools"
          echo "1a6a396b9cd071f7040071fdd108718cb98c3c9f4960044f373b288993d19eb7  $RUNNER_TEMP/build-tools/android-16/aapt2" | sha256sum --check
          echo "b47549e373b895ce6ca620d0c7887e674d9615ffa837a86ac601dcfd04adb0f0  $RUNNER_TEMP/build-tools/android-16/apksigner" | sha256sum --check
          echo "3716d9311e55d2b0918a2fd9d54ba9e406c5f6abeea700b287f11259bc163dec  $RUNNER_TEMP/build-tools/android-16/lib/apksigner.jar" | sha256sum --check
          curl --fail --location --silent --show-error https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip --output "$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip" -d "$RUNNER_TEMP/cmdline-tools"
          echo "c3912376ada67603a09a45701397b8d1ccec2ea138122b8aaae9dc57b47064b0  $RUNNER_TEMP/cmdline-tools/cmdline-tools/bin/apkanalyzer" | sha256sum --check
          echo "a41766a6bf679feae9d8c65cfead8ba7573bd7762feedd808715a72a808328b2  $RUNNER_TEMP/cmdline-tools/cmdline-tools/lib/apkanalyzer-classpath.jar" | sha256sum --check
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk/bin" >> "$GITHUB_PATH"
      - name: Independently verify and stage the public package
        id: stage
        shell: bash
        env:
          CERTIFICATE_SHA256: ${{ vars.ANDROID_PREVIEW_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_SHA256"
          prepared_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/release_gate.py verify-and-stage \
            --handoff "$RUNNER_TEMP/nytshift-signing-handoff" \
            --aapt2 "$RUNNER_TEMP/build-tools/android-16/aapt2" \
            --apkanalyzer "$RUNNER_TEMP/cmdline-tools/cmdline-tools/bin/apkanalyzer" \
            --apksigner "$RUNNER_TEMP/build-tools/android-16/apksigner" \
            --certificate-sha256 "$CERTIFICATE_SHA256" \
            --source-commit "${{ inputs.source_commit }}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --public-repository "$GITHUB_REPOSITORY" \
            --public-commit "$GITHUB_SHA" \
            --prepared-at "$prepared_at" \
            --output "$RUNNER_TEMP/nytshift-public-release" \
            --github-output "$GITHUB_OUTPUT"
      - name: Require an unused public release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.stage.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "nytshift-release-tag-preflight",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["RELEASE_TAG"]
          for path in (f"/repos/{repo}/releases/tags/{tag}", f"/repos/{repo}/git/ref/tags/{tag}"):
              try:
                  urllib.request.urlopen(urllib.request.Request(f"https://api.github.com{path}", headers=headers), timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise
              raise SystemExit(f"release tag or release already exists: {tag}")
          PY
      - name: Re-run repository and secret gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_repository.py
          python3 tools/secret_scan.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload verified publication bundle
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nytshift-paper-publication-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/nytshift-public-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

  publish:
    name: contents-write-publisher
    needs: verify-and-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nytshift-paper-publication-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/nytshift-public-release
      - name: Install checksum-pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz --output "$RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz"
          echo "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  $RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409  $RUNNER_TEMP/gh_2.97.0_linux_amd64/bin/gh" | sha256sum --check
          echo "$RUNNER_TEMP/gh_2.97.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Publish a complete immutable prerelease from a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-and-stage.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nytshift-public-release"
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "SHA256SUMS android-paper-preview.json nytshift-staging-release.apk provenance.json release-notes.md "
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NYTSHIFT Android PAPER preview $RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft \
            --prerelease \
            --latest=false \
            nytshift-staging-release.apk android-paper-preview.json provenance.json release-notes.md SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  postpublish:
    name: fresh-public-immutable-verification
    needs:
      - verify-and-stage
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nytshift-paper-publication-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/nytshift-public-release
      - name: Install checksum-pinned GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz --output "$RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz"
          echo "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  $RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409  $RUNNER_TEMP/gh_2.97.0_linux_amd64/bin/gh" | sha256sum --check
          echo "$RUNNER_TEMP/gh_2.97.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Verify the immutable release and every local asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-and-stage.outputs.release_tag }}
          EXPECTED_DOWNLOAD_URL: ${{ needs.verify-and-stage.outputs.download_url }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nytshift-public-release"
          sha256sum --check SHA256SUMS
          release_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish)"
          python3 - "$release_state" <<'PY'
          import json, os, sys
          actual = json.loads(sys.argv[1])
          expected = {
              "isDraft": False,
              "isImmutable": True,
              "isPrerelease": True,
              "tagName": os.environ["RELEASE_TAG"],
              "targetCommitish": os.environ["GITHUB_SHA"],
          }
          if actual != expected:
              raise SystemExit(f"published release state differs: {actual!r}")
          metadata = json.load(open("android-paper-preview.json", encoding="utf-8"))
          if metadata["artifact"]["downloadUrl"] != os.environ["EXPECTED_DOWNLOAD_URL"]:
              raise SystemExit("public download URL metadata differs")
          PY
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in nytshift-staging-release.apk android-paper-preview.json provenance.json release-notes.md SHA256SUMS; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
          echo "Verified immutable public PAPER APK: $EXPECTED_DOWNLOAD_URL"
